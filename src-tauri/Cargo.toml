[package]
name = "ig-kamera-bilgisi-sablonu"
version = "0.6.8"
description = "IG Kamera Bilgisi Şablonu"
authors = ["Manus AI"]
edition = "2021"

[lib]
name = "ig_kamera_bilgisi_sablonu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
imageproc = "0.25"
ab_glyph = "0.2"
base64 = "0.22"
tauri-plugin-dialog = "2.7.2"
kamadak-exif = "0.6.1"
